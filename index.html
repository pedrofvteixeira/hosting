<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prompting 101</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: oklch(97% 0.008 70);
    --surface: oklch(100% 0 0);
    --border: oklch(90% 0.008 70);
    --text: oklch(20% 0.01 250);
    --text-muted: oklch(52% 0.01 250);
    --accent: oklch(45% 0.18 250);
    --accent-light: oklch(95% 0.06 250);
    --accent-mid: oklch(88% 0.10 250);
    --amber: oklch(72% 0.16 75);
    --amber-light: oklch(96% 0.05 75);
    --green: oklch(60% 0.16 145);
    --green-light: oklch(95% 0.06 145);
    --red: oklch(55% 0.18 25);
    --red-light: oklch(96% 0.05 25);
    --sidebar-w: 280px;
  }

  html, body { height: 100%; }

  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }

  #root { height: 100%; display: flex; }

  /* SIDEBAR */
  .sidebar {
    width: var(--sidebar-w);
    min-width: var(--sidebar-w);
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    height: 100vh;
    position: sticky;
    top: 0;
  }

  .sidebar-logo {
    padding: 28px 24px 20px;
    border-bottom: 1px solid var(--border);
  }

  .sidebar-logo h1 {
    font-size: 18px;
    font-weight: 800;
    color: var(--accent);
    letter-spacing: -0.5px;
  }

  .sidebar-logo p {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 2px;
    font-weight: 500;
  }

  .sidebar-nav {
    flex: 1;
    padding: 16px 0;
  }

  .nav-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--text-muted);
    text-transform: uppercase;
    padding: 0 24px 8px;
    margin-top: 8px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 24px;
    cursor: pointer;
    transition: background 0.15s;
    position: relative;
  }

  .nav-item:hover { background: var(--bg); }

  .nav-item.active {
    background: var(--accent-light);
  }

  .nav-item.active::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--accent);
    border-radius: 0 2px 2px 0;
  }

  .nav-dot {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    flex-shrink: 0;
    background: var(--border);
    color: var(--text-muted);
    transition: all 0.2s;
  }

  .nav-item.active .nav-dot {
    background: var(--accent);
    color: white;
  }

  .nav-item.done .nav-dot {
    background: var(--green);
    color: white;
  }

  .nav-item.exam .nav-dot {
    background: var(--amber);
    color: white;
  }

  .nav-item.exam.active .nav-dot {
    background: var(--amber);
  }

  .nav-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    text-wrap: pretty;
    line-height: 1.3;
  }

  .nav-item.active .nav-title { color: var(--accent); }

  .nav-check {
    margin-left: auto;
    color: var(--green);
    font-size: 14px;
    flex-shrink: 0;
  }

  .progress-bar-wrap {
    padding: 16px 24px;
    border-top: 1px solid var(--border);
  }

  .progress-bar-label {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  .progress-bar {
    height: 6px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 99px;
    transition: width 0.5s ease;
  }

  /* MAIN */
  .main {
    flex: 1;
    overflow-y: auto;
    height: 100vh;
  }

  .chapter-view {
    max-width: 720px;
    margin: 0 auto;
    padding: 48px 48px 80px;
  }

  .chapter-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--accent-light);
    color: var(--accent);
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    padding: 4px 12px;
    border-radius: 99px;
    margin-bottom: 16px;
  }

  .chapter-title {
    font-size: 36px;
    font-weight: 800;
    letter-spacing: -1px;
    color: var(--text);
    margin-bottom: 8px;
    text-wrap: pretty;
    line-height: 1.15;
  }

  .chapter-subtitle {
    font-size: 17px;
    color: var(--text-muted);
    font-weight: 500;
    margin-bottom: 40px;
    text-wrap: pretty;
  }

  /* CONTENT BLOCKS */
  .block { margin-bottom: 28px; }

  .block p {
    font-size: 16px;
    color: var(--text);
    text-wrap: pretty;
    line-height: 1.75;
  }

  .block h3 {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 10px;
    letter-spacing: -0.3px;
    color: var(--text);
  }

  .block ul {
    margin: 0;
    padding-left: 20px;
  }

  .block li {
    font-size: 16px;
    line-height: 1.75;
    margin-bottom: 4px;
    color: var(--text);
  }

  .block li strong {
    color: var(--accent);
    font-weight: 700;
  }

  .example-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-top: 8px;
  }

  .example-header {
    padding: 10px 16px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .example-bad .example-header { background: var(--red-light); color: var(--red); }
  .example-good .example-header { background: var(--green-light); color: var(--green); }

  .example-body {
    padding: 16px;
    font-size: 14px;
    font-family: 'Plus Jakarta Sans', monospace;
    line-height: 1.65;
    color: var(--text);
    white-space: pre-wrap;
  }

  .tip-card {
    background: var(--amber-light);
    border: 1px solid oklch(88% 0.10 75);
    border-radius: 12px;
    padding: 16px 20px;
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }

  .tip-icon {
    font-size: 20px;
    line-height: 1;
    margin-top: 1px;
    flex-shrink: 0;
  }

  .tip-card p {
    font-size: 14px;
    color: oklch(35% 0.08 75);
    line-height: 1.65;
  }

  .tip-card strong {
    font-weight: 700;
    display: block;
    margin-bottom: 3px;
    color: oklch(28% 0.10 75);
  }

  .info-card {
    background: var(--accent-light);
    border: 1px solid var(--accent-mid);
    border-radius: 12px;
    padding: 16px 20px;
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }

  .info-card p {
    font-size: 14px;
    color: oklch(30% 0.10 250);
    line-height: 1.65;
  }

  .info-card strong {
    font-weight: 700;
    display: block;
    margin-bottom: 3px;
    color: oklch(25% 0.12 250);
  }

  .divider {
    height: 1px;
    background: var(--border);
    margin: 40px 0;
  }

  /* QUIZ */
  .quiz-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
    margin-top: 16px;
  }

  .quiz-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 24px;
  }

  .quiz-badge {
    background: var(--accent);
    color: white;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    padding: 4px 10px;
    border-radius: 99px;
  }

  .quiz-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
  }

  .quiz-progress-text {
    margin-left: auto;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
  }

  .question-text {
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 16px;
    line-height: 1.55;
    text-wrap: pretty;
  }

  .options-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 20px;
  }

  .option-btn {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 16px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    cursor: pointer;
    text-align: left;
    transition: all 0.15s;
    font-family: inherit;
  }

  .option-btn:hover:not(:disabled) {
    border-color: var(--accent);
    background: var(--accent-light);
  }

  .option-btn.selected:not(.answered) {
    border-color: var(--accent);
    background: var(--accent-light);
  }

  .option-btn.correct {
    border-color: var(--green);
    background: var(--green-light);
  }

  .option-btn.wrong {
    border-color: var(--red);
    background: var(--red-light);
  }

  .option-btn:disabled { cursor: default; }

  .option-letter {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    flex-shrink: 0;
    color: var(--text-muted);
    transition: all 0.15s;
  }

  .option-btn.selected:not(.answered) .option-letter,
  .option-btn:hover:not(:disabled) .option-letter {
    background: var(--accent);
    color: white;
  }

  .option-btn.correct .option-letter {
    background: var(--green);
    color: white;
  }

  .option-btn.wrong .option-letter {
    background: var(--red);
    color: white;
  }

  .option-text {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.5;
    text-wrap: pretty;
  }

  .feedback-box {
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 20px;
    font-size: 14px;
    line-height: 1.6;
    text-wrap: pretty;
  }

  .feedback-box.correct {
    background: var(--green-light);
    border: 1px solid oklch(80% 0.12 145);
    color: oklch(28% 0.12 145);
  }

  .feedback-box.wrong {
    background: var(--red-light);
    border: 1px solid oklch(82% 0.10 25);
    color: oklch(30% 0.12 25);
  }

  .feedback-box strong { font-weight: 700; }

  .quiz-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
  }

  .btn {
    padding: 10px 22px;
    border-radius: 8px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    border: none;
    transition: all 0.15s;
  }

  .btn-primary {
    background: var(--accent);
    color: white;
  }

  .btn-primary:hover { background: oklch(40% 0.18 250); }
  .btn-primary:disabled { opacity: 0.4; cursor: default; }

  .btn-secondary {
    background: var(--surface);
    color: var(--text);
    border: 1.5px solid var(--border);
  }

  .btn-secondary:hover { background: var(--bg); }

  /* QUIZ RESULT */
  .quiz-result {
    text-align: center;
    padding: 16px 0;
  }

  .result-score-big {
    font-size: 56px;
    font-weight: 800;
    letter-spacing: -2px;
    color: var(--accent);
    line-height: 1;
    margin-bottom: 4px;
  }

  .result-label {
    font-size: 16px;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 20px;
  }

  .result-stars {
    font-size: 28px;
    margin-bottom: 16px;
    letter-spacing: 4px;
  }

  .result-message {
    font-size: 15px;
    color: var(--text-muted);
    margin-bottom: 28px;
    max-width: 340px;
    margin-left: auto;
    margin-right: auto;
    text-wrap: pretty;
  }

  .next-chapter-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--accent);
    color: white;
    padding: 12px 28px;
    border-radius: 10px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    border: none;
    transition: all 0.15s;
  }

  .next-chapter-btn:hover { background: oklch(40% 0.18 250); }

  /* HOME */
  .home-view {
    max-width: 680px;
    margin: 0 auto;
    padding: 64px 48px 80px;
  }

  .home-eyebrow {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--accent);
    margin-bottom: 16px;
  }

  .home-title {
    font-size: 48px;
    font-weight: 800;
    letter-spacing: -2px;
    line-height: 1.08;
    color: var(--text);
    margin-bottom: 20px;
  }

  .home-title span { color: var(--accent); }

  .home-desc {
    font-size: 18px;
    color: var(--text-muted);
    line-height: 1.7;
    margin-bottom: 40px;
    text-wrap: pretty;
  }

  .chapters-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 32px;
  }

  .chapter-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .chapter-card:hover {
    border-color: var(--accent);
    transform: translateY(-1px);
    box-shadow: 0 4px 16px oklch(45% 0.18 250 / 0.08);
  }

  .chapter-card-num {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  .chapter-card-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.4;
  }

  .chapter-card-icon {
    font-size: 22px;
    margin-bottom: 10px;
  }

  .start-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--accent);
    color: white;
    padding: 16px 32px;
    border-radius: 12px;
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    border: none;
    transition: all 0.15s;
    box-shadow: 0 4px 20px oklch(45% 0.18 250 / 0.25);
  }

  .start-btn:hover {
    background: oklch(40% 0.18 250);
    box-shadow: 0 6px 24px oklch(45% 0.18 250 / 0.35);
  }

  /* EXAM */
  .exam-view {
    max-width: 720px;
    margin: 0 auto;
    padding: 48px 48px 80px;
  }

  .exam-header-section {
    background: linear-gradient(135deg, var(--accent) 0%, oklch(52% 0.20 270) 100%);
    border-radius: 16px;
    padding: 32px;
    color: white;
    margin-bottom: 32px;
  }

  .exam-header-section h2 {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.5px;
    margin-bottom: 8px;
  }

  .exam-header-section p {
    opacity: 0.85;
    font-size: 15px;
    font-weight: 500;
  }

  .exam-stats {
    display: flex;
    gap: 20px;
    margin-top: 20px;
  }

  .exam-stat {
    background: white/20;
    background: oklch(100% 0 0 / 0.15);
    border-radius: 8px;
    padding: 10px 16px;
    text-align: center;
  }

  .exam-stat-num {
    font-size: 22px;
    font-weight: 800;
  }

  .exam-stat-label {
    font-size: 11px;
    opacity: 0.8;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  /* EXAM RESULT */
  .exam-result-view {
    max-width: 600px;
    margin: 0 auto;
    padding: 64px 48px;
    text-align: center;
  }

  .exam-score-circle {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: var(--accent-light);
    border: 3px solid var(--accent);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin: 0 auto 24px;
  }

  .exam-score-num {
    font-size: 40px;
    font-weight: 800;
    color: var(--accent);
    letter-spacing: -2px;
    line-height: 1;
  }

  .exam-score-denom {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
  }

  .exam-result-title {
    font-size: 28px;
    font-weight: 800;
    color: var(--text);
    letter-spacing: -0.5px;
    margin-bottom: 12px;
  }

  .exam-result-desc {
    font-size: 16px;
    color: var(--text-muted);
    line-height: 1.7;
    margin-bottom: 32px;
    max-width: 400px;
    margin-left: auto;
    margin-right: auto;
    text-wrap: pretty;
  }

  .chapter-breakdown {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 32px;
    text-align: left;
  }

  .breakdown-row {
    display: flex;
    align-items: center;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    gap: 12px;
  }

  .breakdown-row:last-child { border-bottom: none; }

  .breakdown-name {
    flex: 1;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
  }

  .breakdown-bar-wrap {
    width: 100px;
    height: 6px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }

  .breakdown-bar {
    height: 100%;
    border-radius: 99px;
    transition: width 0.8s ease;
  }

  .breakdown-score {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-muted);
    width: 32px;
    text-align: right;
  }

  /* ANIM */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .fade-up {
    animation: fadeUp 0.35s ease both;
  }

  @keyframes popIn {
    from { opacity: 0; transform: scale(0.96); }
    to { opacity: 1; transform: scale(1); }
  }

  .pop-in { animation: popIn 0.25s ease both; }

  /* PROFESSOR CARD */
  .professor-card {
    background: oklch(96% 0.06 295);
    border: 1.5px solid oklch(82% 0.12 295);
    border-radius: 14px;
    padding: 20px 20px 18px;
    display: flex;
    gap: 14px;
    align-items: flex-start;
  }

  .professor-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: oklch(55% 0.20 295);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
    box-shadow: 0 2px 8px oklch(55% 0.20 295 / 0.25);
  }

  .professor-content { flex: 1; }

  .professor-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: oklch(42% 0.16 295);
    margin-bottom: 6px;
  }

  .professor-body {
    font-size: 14px;
    color: oklch(28% 0.10 295);
    line-height: 1.7;
    text-wrap: pretty;
  }

  .professor-body em {
    font-style: italic;
    color: oklch(38% 0.14 295);
  }

  /* RAQUEL GREETING */
  .raquel-greeting {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: oklch(96% 0.06 15);
    border: 1px solid oklch(86% 0.10 15);
    border-radius: 99px;
    padding: 6px 16px;
    font-size: 13px;
    font-weight: 700;
    color: oklch(40% 0.16 15);
    margin-bottom: 20px;
  }

const LETTERS = ['A','B','C','D'];

function getStars(pct) {
  if (pct === 100) return '★★★';
  if (pct >= 67) return '★★☆';
  return '★☆☆';
}

function getMessage(pct) {
  if (pct === 100) return 'Perfeito! Dominaste completamente este capítulo.';
  if (pct >= 67) return 'Bom trabalho! Revê as questões em que erraste para consolidar o conhecimento.';
  return 'Não desanimes — revê o capítulo e tenta de novo. A aprendizagem vem com repetição.';
}

function getExamTitle(pct) {
  if (pct >= 90) return '🎓 Excelente — Prompting Expert!';
  if (pct >= 70) return '✅ Bom resultado — Continua a praticar!';
  if (pct >= 50) return '📖 A melhorar — Revê os capítulos fracos';
  return '🔁 Precisas de mais estudo — Volta aos capítulos';
}

function ContentBlock({ block }) {
  if (block.type === 'text') {
    const html = block.body.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    return <div className="block"><p dangerouslySetInnerHTML={{__html: html}} /></div>;
  }
  if (block.type === 'heading') {
    return <div className="block"><h3>{block.body}</h3></div>;
  }
  if (block.type === 'list') {
    return (
      <div className="block">
        <ul>
          {block.items.map((item, i) => {
            const html = item.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            return <li key={i} dangerouslySetInnerHTML={{__html: html}} />;
          })}
        </ul>
      </div>
    );
  }
  if (block.type === 'professor') {
    return (
      <div className="block">
        <div className="professor-card">
          <div className="professor-avatar">🤓</div>
          <div className="professor-content">
            <div className="professor-label">Professor Pedro {block.label || 'explica'}</div>
            <div className="professor-body" dangerouslySetInnerHTML={{__html: block.body.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/_(.*?)_/g,'<em>$1</em>')}} />
          </div>
        </div>
      </div>
    );
  }
  if (block.type === 'tip') {
    return (
      <div className="block">
        <div className="tip-card">
          <span className="tip-icon">💡</span>
          <p><strong>{block.title}</strong>{block.body}</p>
        </div>
      </div>
    );
  }
  if (block.type === 'info') {
    return (
      <div className="block">
        <div className="info-card">
          <span className="tip-icon">ℹ️</span>
          <p><strong>{block.title}</strong>{block.body}</p>
        </div>
      </div>
    );
  }
  if (block.type === 'example') {
    const cls = block.variant === 'bad' ? 'example-card example-bad' : block.variant === 'good' ? 'example-card example-good' : 'example-card';
    return (
      <div className="block">
        <div className={cls}>
          <div className="example-header">{block.label}</div>
          <div className="example-body">{block.text}</div>
        </div>
      </div>
    );
  }
  return null;
}

function QuizQuestion({ question, qIndex, total, onAnswer, answered, selected }) {
  return (
    <div className="pop-in">
      <div className="quiz-header">
        <span className="quiz-badge">Quiz</span>
        <span className="quiz-title">Testa o teu conhecimento</span>
        <span className="quiz-progress-text">{qIndex + 1} / {total}</span>
      </div>
      <div className="question-text">{question.q}</div>
      <div className="options-list">
        {question.opts.map((opt, i) => {
          let cls = 'option-btn';
          if (answered) {
            cls += ' answered';
            if (i === question.correct) cls += ' correct';
            else if (i === selected && i !== question.correct) cls += ' wrong';
          } else if (i === selected) {
            cls += ' selected';
          }
          return (
            <button
              key={i}
              className={cls}
              disabled={answered}
              onClick={() => !answered && onAnswer(i)}
            >
              <span className="option-letter">{LETTERS[i]}</span>
              <span className="option-text">{opt}</span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

function ChapterQuiz({ questions, onComplete }) {
  const [qIdx, setQIdx] = useState(0);
  const [selected, setSelected] = useState(null);
  const [answered, setAnswered] = useState(false);
  const [score, setScore] = useState(0);
  const [done, setDone] = useState(false);
  const [answers, setAnswers] = useState([]);

  function handleAnswer(i) {
    setSelected(i);
    setAnswered(true);
    const correct = i === questions[qIdx].correct;
    if (correct) setScore(s => s + 1);
    setAnswers(a => [...a, {selected: i, correct}]);
  }

  function handleNext() {
    if (qIdx + 1 >= questions.length) {
      setDone(true);
    } else {
      setQIdx(q => q + 1);
      setSelected(null);
      setAnswered(false);
    }
  }

  const pct = Math.round((score / questions.length) * 100);

  const raquelResults = [
    { min: 100, msg: "Perfeita, Raquel! 🎉 Dominaste completamente este capítulo." },
    { min: 67,  msg: "Muito bem, Raquel! Revê as questões em que erraste para consolidar." },
    { min: 0,   msg: "Não desanimes, Raquel — revê o capítulo e tenta de novo. Consegues!" },
  ];

  if (done) {
    const raqMsg = raquelResults.find(r => pct >= r.min)?.msg || raquelResults[2].msg;
    return (
      <div className="quiz-section pop-in">
        <div className="quiz-result">
          <div className="raquel-greeting">🌸 {raqMsg.split('!')[0]}!</div>
          <div className="result-score-big">{pct}%</div>
          <div className="result-label">{score} de {questions.length} corretas</div>
          <div className="result-stars">{getStars(pct)}</div>
          <div className="result-message">{raqMsg}</div>
          <button className="next-chapter-btn" onClick={() => onComplete(score)}>
            Continuar →
          </button>
        </div>
      </div>
    );
  }

  const q = questions[qIdx];
  return (
    <div className="quiz-section">
      <QuizQuestion
        question={q}
        qIndex={qIdx}
        total={questions.length}
        onAnswer={handleAnswer}
        answered={answered}
        selected={selected}
      />
      {answered && (
        <div className={`feedback-box pop-in ${selected === q.correct ? 'correct' : 'wrong'}`}>
          <strong>{selected === q.correct ? '✓ Correto!' : '✗ Não exatamente.'}</strong>
          {q.explanation}
        </div>
      )}
      <div className="quiz-actions">
        {answered && (
          <button className="btn btn-primary" onClick={handleNext}>
            {qIdx + 1 >= questions.length ? 'Ver resultado' : 'Próxima →'}
          </button>
        )}
        {!answered && (
          <button className="btn btn-primary" disabled={selected === null} onClick={() => selected !== null && handleAnswer(selected)}>
            Confirmar
          </button>
        )}
      </div>
    </div>
  );
}

  const [selected, setSelected] = useState(null);
  const [answered, setAnswered] = useState(false);
  const [scores, setScores] = useState([]);
  const [done, setDone] = useState(false);

  function handleAnswer(i) {
    setSelected(i);
    setAnswered(true);
  }

  function handleNext() {
    const correct = selected === EXAM_QUESTIONS[qIdx].correct;
    const newScores = [...scores, {q: qIdx, correct, selected}];
    setScores(newScores);
    if (qIdx + 1 >= EXAM_QUESTIONS.length) {
      setDone(true);
      onExamComplete && onExamComplete();
    } else {
      setQIdx(q => q + 1);
      setSelected(null);
      setAnswered(false);
    }
  }

  if (done) {
    const total = EXAM_QUESTIONS.length;
    const right = scores.filter(s => s.correct).length;
    const pct = Math.round((right / total) * 100);

    // Per chapter breakdown (rough)
    const byChapter = {};
    EXAM_QUESTIONS.forEach((q, i) => {
      if (!byChapter[q.chapter]) byChapter[q.chapter] = {total:0, correct:0};
      byChapter[q.chapter].total++;
      if (scores[i]?.correct) byChapter[q.chapter].correct++;
    });

    return (
      <div className="exam-result-view fade-up">
        <div className="exam-score-circle">
          <div className="exam-score-num">{right}</div>
          <div className="exam-score-denom">de {total}</div>
        </div>
        <h2 className="exam-result-title">{getExamTitle(pct)}</h2>
        <p className="exam-result-desc">
          Obtiveste <strong>{pct}%</strong> no exame final. {pct >= 70 ? 'Demonstras um bom domínio dos conceitos de prompting — continua a praticar!' : 'Revê os capítulos em que tiveste mais dificuldades e tenta novamente.'}
        </p>

        <div className="chapter-breakdown">
          {Object.entries(byChapter).map(([ch, data]) => {
            const p = Math.round((data.correct / data.total) * 100);
            const color = p >= 67 ? 'var(--green)' : p >= 34 ? 'var(--amber)' : 'var(--red)';
            return (
              <div className="breakdown-row" key={ch}>
                <div className="breakdown-name">{ch}</div>
                <div className="breakdown-bar-wrap">
                  <div className="breakdown-bar" style={{width: p+'%', background: color}} />
                </div>
                <div className="breakdown-score">{data.correct}/{data.total}</div>
              </div>
            );
          })}
        </div>

        <div style={{display:'flex', gap:12, justifyContent:'center', flexWrap:'wrap'}}>
          <button className="btn btn-secondary" onClick={() => { setQIdx(0); setSelected(null); setAnswered(false); setScores([]); setDone(false); }}>
            Repetir Exame
          </button>
          <button className="next-chapter-btn" onClick={onFinish}>
            Voltar ao Início
          </button>
          <button className="next-chapter-btn" style={{background:'oklch(38% 0.18 295)'}} onClick={onProject}>
            🏆 Projeto Final →
          </button>
        </div>
      </div>
    );
  }

  const q = EXAM_QUESTIONS[qIdx];
  return (
    <div className="exam-view fade-up">
      <div className="exam-header-section">
        <h2>🎓 Exame Final</h2>
        <p>Avaliação abrangente de todos os capítulos</p>
        <div className="exam-stats">
          <div className="exam-stat">
            <div className="exam-stat-num">{qIdx + 1}/{EXAM_QUESTIONS.length}</div>
            <div className="exam-stat-label">Questão</div>
          </div>
          <div className="exam-stat">
            <div className="exam-stat-num">{scores.filter(s=>s.correct).length}</div>
            <div className="exam-stat-label">Corretas</div>
          </div>
          <div className="exam-stat">
            <div className="exam-stat-num">{Math.round((qIdx/EXAM_QUESTIONS.length)*100)}%</div>
            <div className="exam-stat-label">Progresso</div>
          </div>
        </div>
      </div>

      <div className="quiz-section">
        <QuizQuestion
          question={q}
          qIndex={qIdx}
          total={EXAM_QUESTIONS.length}
          onAnswer={handleAnswer}
          answered={answered}
          selected={selected}
        />
        {answered && (
          <div className={`feedback-box pop-in ${selected === q.correct ? 'correct' : 'wrong'}`}>
            <strong>{selected === q.correct ? '✓ Correto!' : '✗ Não exatamente.'}</strong>
            {q.explanation}
          </div>
        )}
        <div className="quiz-actions">
          {answered && (
            <button className="btn btn-primary" onClick={handleNext}>
              {qIdx + 1 >= EXAM_QUESTIONS.length ? 'Ver resultado final' : 'Próxima →'}
            </button>
          )}
          {!answered && (
            <button className="btn btn-primary" disabled={selected === null}>
              Confirmar
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

function HomeView({ onStart, onChapter, completedChapters }) {
  return (
    <div className="home-view fade-up">
      <div className="home-eyebrow">Curso interativo · 8 capítulos</div>
      <h1 className="home-title">Prompting<br/><span>101</span></h1>
      <div style={{display:'flex', alignItems:'center', gap:10, marginBottom:16}}>
        <div style={{fontSize:32}}>🤓</div>
        <div>
          <div style={{fontSize:13, fontWeight:700, color:'oklch(42% 0.16 295)'}}>Professor Pedro dá as boas-vindas, Raquel!</div>
          <div style={{fontSize:13, color:'var(--text-muted)', fontWeight:500}}>Este curso foi preparado especialmente para ti.</div>
        </div>
      </div>
      <p className="home-desc">
        Aprende a comunicar eficazmente com LLMs — desde os conceitos base até técnicas avançadas. Cada capítulo termina com um quiz. No final, um exame abrangente.
      </p>

      <div className="chapters-grid">
        {CHAPTERS.map(ch => (
          <div className="chapter-card" key={ch.id} onClick={() => onChapter(ch.id)}>
            <div className="chapter-card-icon">{ch.icon}</div>
            <div className="chapter-card-num">Capítulo {ch.id}</div>
            <div className="chapter-card-title">{ch.title}</div>
            {completedChapters.has(ch.id) && <div style={{marginTop:8, fontSize:12, color:'var(--green)', fontWeight:700}}>✓ Concluído</div>}
          </div>
        ))}
      </div>

      <button className="start-btn" onClick={onStart}>
        {completedChapters.size > 0 ? 'Continuar →' : 'Começar →'}
      </button>
    </div>
  );
}

// ─── APP ──────────────────────────────────────────────────────────────────────

function App() {
  const [view, setView] = useState('home');
  const [currentChapter, setCurrentChapter] = useState(1);
  const [completedChapters, setCompletedChapters] = useState(new Set());
  const [examCompleted, setExamCompleted] = useState(false);
  const [projectCompleted, setProjectCompleted] = useState(false);

  // Load progress
  useEffect(() => {
    try {
      const saved = localStorage.getItem('p101_completed');
      if (saved) setCompletedChapters(new Set(JSON.parse(saved)));
      if (localStorage.getItem('p101_exam')) setExamCompleted(true);
      if (localStorage.getItem('p101_project')) setProjectCompleted(true);
    } catch(e) {}
  }, []);

  function saveCompleted(set) {
    try { localStorage.setItem('p101_completed', JSON.stringify([...set])); } catch(e) {}
  }

  function handleExamComplete() {
    setExamCompleted(true);
    try { localStorage.setItem('p101_exam', '1'); } catch(e) {}
  }

  function handleProjectComplete() {
    setProjectCompleted(true);
    try { localStorage.setItem('p101_project', '1'); } catch(e) {}
    setView('extraCredits');
    document.querySelector('.main')?.scrollTo(0,0);
  }

  function handleQuizComplete(chapterId, score) {
    const next = new Set(completedChapters);
    next.add(chapterId);
    setCompletedChapters(next);
    saveCompleted(next);

    const nextId = chapterId + 1;
    if (nextId <= CHAPTERS.length) {
      setCurrentChapter(nextId);
      setView('chapter');
      document.querySelector('.main')?.scrollTo(0, 0);
    } else {
      setView('exam');
      document.querySelector('.main')?.scrollTo(0, 0);
    }
  }

  function goToChapter(id) {
    setCurrentChapter(id);
    setView('chapter');
    document.querySelector('.main')?.scrollTo(0, 0);
  }

  const ch8Done = completedChapters.has(8);
  const examLocked = !ch8Done;
  const projectLocked = !examCompleted;
  const extraLocked = !projectCompleted;

  const progressPct = Math.round((completedChapters.size / CHAPTERS.length) * 100);

  return (
    <>
      {/* SIDEBAR */}
      <aside className="sidebar">
        <div className="sidebar-logo" style={{cursor:'pointer'}} onClick={() => setView('home')}>
          <h1>Prompting 101</h1>
          <p>Guia de introdução aos LLMs</p>
        </div>

        <nav className="sidebar-nav">
          <div className="nav-label">Capítulos</div>
          {CHAPTERS.map(ch => {
            const done = completedChapters.has(ch.id);
            const active = view === 'chapter' && currentChapter === ch.id;
            return (
              <div
                key={ch.id}
                className={`nav-item ${active ? 'active' : ''} ${done ? 'done' : ''}`}
                onClick={() => goToChapter(ch.id)}
              >
                <span className="nav-dot">{done ? '✓' : ch.id}</span>
                <span className="nav-title">{ch.title}</span>
              </div>
            );
          })}

          <div className="nav-label" style={{marginTop:16}}>Avaliação</div>
          <div
            className={`nav-item exam ${view === 'exam' ? 'active' : ''} ${examLocked ? 'locked' : ''}`}
            onClick={() => { if (!examLocked) { setView('exam'); document.querySelector('.main')?.scrollTo(0,0); } }}
            style={{opacity: examLocked ? 0.45 : 1, cursor: examLocked ? 'not-allowed' : 'pointer'}}
            title={examLocked ? 'Conclui o capítulo 8 primeiro' : ''}
          >
            <span className="nav-dot">{examLocked ? '🔒' : '★'}</span>
            <span className="nav-title">Exame Final{examLocked ? <span style={{fontSize:10, color:'var(--text-muted)', display:'block', fontWeight:500}}>Requer Cap. 8</span> : ''}</span>
          </div>
          <div
            className={`nav-item exam ${view === 'project' ? 'active' : ''}`}
            style={{opacity: projectLocked ? 0.45 : 1, cursor: projectLocked ? 'not-allowed' : 'pointer', '--accent': 'oklch(38% 0.18 295)'}}
            onClick={() => { if (!projectLocked) { setView('project'); document.querySelector('.main')?.scrollTo(0,0); } }}
            title={projectLocked ? 'Conclui o exame final primeiro' : ''}
          >
            <span className="nav-dot" style={{background: view === 'project' ? 'oklch(38% 0.18 295)' : undefined}}>{projectLocked ? '🔒' : '★'}</span>
            <span className="nav-title">Projeto Final{projectLocked ? <span style={{fontSize:10, color:'var(--text-muted)', display:'block', fontWeight:500}}>Requer Exame</span> : ''}</span>
          </div>
          <div
            className={`nav-item exam ${view === 'extraCredits' ? 'active' : ''}`}
            style={{opacity: extraLocked ? 0.45 : 1, cursor: extraLocked ? 'not-allowed' : 'pointer', '--accent': 'oklch(45% 0.22 0)'}}
            onClick={() => { if (!extraLocked) { setView('extraCredits'); document.querySelector('.main')?.scrollTo(0,0); } }}
            title={extraLocked ? 'Conclui o projeto final primeiro' : ''}
          >
            <span className="nav-dot" style={{background: view === 'extraCredits' ? 'oklch(45% 0.22 0)' : undefined}}>{extraLocked ? '🔒' : '🌹'}</span>
            <span className="nav-title">Créditos Extra{extraLocked ? <span style={{fontSize:10, color:'var(--text-muted)', display:'block', fontWeight:500}}>Requer Projeto</span> : ''}</span>
          </div>
        </nav>

        <div className="progress-bar-wrap">
          <div className="progress-bar-label">
            <span>Progresso</span>
            <span>{completedChapters.size}/{CHAPTERS.length}</span>
          </div>
          <div className="progress-bar">
            <div className="progress-fill" style={{width: progressPct + '%'}} />
          </div>
        </div>
      </aside>

      {/* MAIN */}
      <main className="main">
        {view === 'home' && (
          <HomeView
            onStart={() => goToChapter(1)}
            onChapter={goToChapter}
            completedChapters={completedChapters}
          />
        )}
        {view === 'chapter' && (
          <ChapterView
            key={currentChapter}
            chapter={CHAPTERS[currentChapter - 1]}
            quizDone={completedChapters.has(currentChapter)}
            onQuizComplete={(score) => handleQuizComplete(currentChapter, score)}
          />
        )}
        {view === 'exam' && (
          <ExamView
            onFinish={() => setView('home')}
            onProject={() => { setView('project'); document.querySelector('.main')?.scrollTo(0,0); }}
            onExamComplete={handleExamComplete}
          />
        )}
        {view === 'project' && (
          <FinalProjectView onComplete={handleProjectComplete} />
        )}
        {view === 'extraCredits' && (
          <ExtraCreditsView />
        )}
      </main>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
